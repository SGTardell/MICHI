<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MICHI — Sign In & Workspace Access</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="Images/Michi_Appicon.png">
  <link rel="apple-touch-icon-precomposed" href="Images/Michi_Appicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="Images/Michi_Appicon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="Images/Michi_Appicon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="Images/Michi_Appicon.png">
  <link rel="icon" type="image/png" href="Images/Michi_Appicon.png">
  <link rel="stylesheet" href="styles.css?v=215">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <script>
    (function() {
      let savedTheme = localStorage.getItem('MICHI_COLOR_THEME') || 'soyokaze';
      if (savedTheme === 'tokyo') savedTheme = 'winter';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  <style>
    body {
      background: var(--bg-dark, #F9FEFF);
      color: var(--text-main, #616363);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 1.5rem;
      box-sizing: border-box;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card, #D9DDDE);
      border: 1px solid var(--border, #B2B7B9);
      border-radius: var(--radius-lg, 16px);
      padding: 2.2rem;
      box-shadow: var(--shadow-lg, 0 10px 30px rgba(0, 0, 0, 0.25));
      box-sizing: border-box;
      color: var(--text-main, #616363);
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 1.8rem;
    }

    .auth-brand img {
      height: 72px;
      max-width: 220px;
      width: auto;
      object-fit: contain;
      margin-bottom: 0.8rem;
      border-radius: 0;
      box-shadow: none;
      filter: var(--logo-filter, brightness(0.38));
    }

    .auth-brand h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-main, #616363);
      margin: 0 0 0.3rem 0;
      letter-spacing: 0.5px;
    }

    .auth-brand p {
      font-size: 0.85rem;
      color: var(--text-muted, #616363);
      margin: 0;
    }

    .auth-tabs {
      display: flex;
      background: var(--bg-main, #F9FEFF);
      border-radius: var(--radius-sm, 8px);
      padding: 4px;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border, #B2B7B9);
    }

    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 0.55rem;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-muted, #616363);
      border: none;
      background: transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .auth-tab.active {
      background: var(--bg-card, #D9DDDE);
      color: var(--text-main, #616363);
      border: 1px solid var(--border, #B2B7B9);
    }

    .auth-form {
      display: none;
      flex-direction: column;
      gap: 1.1rem;
    }

    .auth-form.active {
      display: flex;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-main, #616363);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      padding: 0.75rem 2.4rem 0.75rem 0.9rem;
      background: var(--bg-main, #F9FEFF);
      color: var(--text-main, #616363);
      border: 1px solid var(--border, #B2B7B9);
      border-radius: var(--radius-sm, 8px);
      font-size: 0.9rem;
      font-weight: 600;
      box-sizing: border-box;
      outline: none;
    }

    .input-wrapper input::placeholder {
      color: var(--text-muted, #94A3B8);
    }

    .input-wrapper input:focus {
      border-color: var(--border, #616363);
    }

    .toggle-password {
      position: absolute;
      right: 0.8rem;
      color: var(--text-main, #616363);
      cursor: pointer;
      font-size: 1.1rem;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--text-main, #616363);
    }

    .form-options label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text-main, #616363);
    }

    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      background: var(--accent, #9FD3E3);
      color: var(--bg-dark, #0C3846);
      border: 1px solid var(--border, #B2B7B9);
      border-radius: var(--radius-sm, 8px);
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 0.4rem;
    }

    .btn-submit:hover {
      background: var(--accent-hover, #E4E8E9);
      transform: scale(0.98);
    }

    .form-footer {
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-main, #616363);
      margin-top: 0.5rem;
    }

    .form-footer a {
      color: var(--text-main, #616363);
      text-decoration: underline;
      font-weight: 700;
    }

    .auth-alert {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm, 8px);
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.3;
    }

    .auth-alert.error {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .auth-alert.success {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .btn-provider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0.6rem 0.8rem;
      border-radius: var(--radius-sm, 8px);
      border: 1px solid var(--border, #B2B7B9);
      background: var(--bg-main, #F9FEFF);
      color: var(--text-main, #616363);
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-provider:hover {
      background: var(--bg-card, #D9DDDE);
      transform: translateY(-1px);
    }

    /* ❄️ Arctic Chill Theme Overrides for Sign In & Create Account Screen */
    [data-theme="arctic"] body {
      background: #C4D2E1 !important;
      color: #112A46 !important;
    }

    [data-theme="arctic"] .auth-card {
      background: #1B3B5A !important;
      border: 2px solid #4D6E91 !important;
      box-shadow: 0 16px 45px rgba(17, 42, 70, 0.4) !important;
      color: #F2F6FB !important;
    }

    [data-theme="arctic"] .auth-brand img {
      filter: brightness(0) invert(1) !important;
    }

    [data-theme="arctic"] .auth-brand h1 {
      color: #F2F6FB !important;
    }

    [data-theme="arctic"] .auth-brand p {
      color: #B2C4D6 !important;
    }

    [data-theme="arctic"] .auth-tabs {
      background: #112A46 !important;
      border-color: #4D6E91 !important;
    }

    [data-theme="arctic"] .auth-tab {
      color: #B2C4D6 !important;
    }

    [data-theme="arctic"] .auth-tab.active {
      background: #F2F6FB !important;
      color: #112A46 !important;
      font-weight: 800 !important;
      border-color: #4D6E91 !important;
    }

    [data-theme="arctic"] .form-group label {
      color: #F2F6FB !important;
      font-weight: 800 !important;
    }

    [data-theme="arctic"] .input-wrapper input {
      background: #F2F6FB !important;
      color: #112A46 !important;
      border: 1.5px solid #4D6E91 !important;
      font-weight: 800 !important;
    }

    [data-theme="arctic"] .input-wrapper input::placeholder {
      color: #4D6E91 !important;
      opacity: 0.9 !important;
    }

    [data-theme="arctic"] .toggle-password {
      color: #112A46 !important;
    }

    [data-theme="arctic"] .form-options {
      color: #F2F6FB !important;
      font-weight: 700 !important;
    }

    [data-theme="arctic"] .form-options label {
      color: #F2F6FB !important;
    }

    [data-theme="arctic"] #linkResetPass {
      color: #B2C4D6 !important;
    }

    [data-theme="arctic"] .btn-submit {
      background: #F2F6FB !important;
      color: #112A46 !important;
      border: 1px solid #4D6E91 !important;
      font-weight: 800 !important;
    }

    [data-theme="arctic"] .btn-provider {
      background: #112A46 !important;
      color: #F2F6FB !important;
      border-color: #4D6E91 !important;
    }

    [data-theme="arctic"] .form-footer {
      color: #F2F6FB !important;
    }

    [data-theme="arctic"] .form-footer a {
      color: #F2F6FB !important;
      text-decoration: underline !important;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-brand">
      <img src="Images/Your Way WH Logo.png" onerror="this.src='Images/Your Way WH Transparent.png'" alt="MICHI Logo" />
      <h1>MICHI</h1>
      <p>Organize Life & Work — Digital Workspace</p>
    </div>

    <!-- Auth Inline Alert Notification -->
    <div id="authAlert" class="auth-alert" style="display: none;"></div>

    <!-- Auth Tabs -->
    <div class="auth-tabs" id="authTabsContainer">
      <button type="button" class="auth-tab active" id="tabLogin">Sign In</button>
      <button type="button" class="auth-tab" id="tabRegister">Create Account</button>
    </div>

    <!-- Social Provider Authentication -->
    <div class="provider-auth-container" style="margin: 0.8rem 0 1.2rem 0; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 10px; margin: 4px 0; color: var(--text-muted, #8E9BAE); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700;">
        <span style="flex: 1; height: 1px; background: var(--border, rgba(255,255,255,0.12)); opacity: 0.5;"></span>
        <span>Or Continue With Provider</span>
        <span style="flex: 1; height: 1px; background: var(--border, rgba(255,255,255,0.12)); opacity: 0.5;"></span>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
        <button type="button" id="btnGoogleAuth" class="btn-provider google-provider-btn">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Google
        </button>

        <button type="button" id="btnAppleAuth" class="btn-provider apple-provider-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.82c.67-.82 1.13-1.97.99-3.12-1 .04-2.18.67-2.88 1.49-.63.73-1.18 1.9-1.03 3.03 1.12.09 2.25-.58 2.92-1.4z"/></svg>
          Apple
        </button>

        <button type="button" id="btnFacebookAuth" class="btn-provider facebook-provider-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Facebook
        </button>
      </div>
    </div>

    <!-- Sign In Form -->
    <form id="loginForm" class="auth-form active">
      <div class="form-group">
        <label for="loginUsername">Username / Email</label>
        <div class="input-wrapper">
          <input type="text" id="loginUsername" placeholder="Enter username or email..." autocapitalize="none" autocorrect="off" spellcheck="false" required />
        </div>
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <div class="input-wrapper">
          <input type="password" id="loginPassword" placeholder="Enter password..." autocapitalize="none" autocorrect="off" spellcheck="false" required />
          <i class="ri-eye-off-fill toggle-password" data-target="loginPassword" title="Toggle password visibility"></i>
        </div>
      </div>

      <div class="form-options">
        <label>
          <input type="checkbox" id="rememberMe" style="accent-color: var(--stage-structure, #009967);" />
          Remember me
        </label>
        <a href="#" id="linkResetPass" style="color: var(--text-muted); font-size: 0.8rem; text-decoration: underline;">Reset Password</a>
      </div>

      <button type="submit" class="btn-submit">Sign In to MICHI ➔</button>

      <div class="form-footer">
        Don't have an account? <a href="#" id="linkToRegister">Create One</a>
      </div>
    </form>

    <!-- Create Account Form -->
    <form id="registerForm" class="auth-form">
      <div class="form-group">
        <label for="regUsername">Full Name or Username</label>
        <div class="input-wrapper">
          <input type="text" id="regUsername" placeholder="Enter your name..." autocapitalize="none" autocorrect="off" spellcheck="false" required />
        </div>
      </div>

      <div class="form-group">
        <label for="regPassword">Password</label>
        <div class="input-wrapper">
          <input type="password" id="regPassword" placeholder="Choose a password..." autocapitalize="none" autocorrect="off" spellcheck="false" required />
          <i class="ri-eye-off-fill toggle-password" data-target="regPassword" title="Toggle password visibility"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="regConfirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <input type="password" id="regConfirmPassword" placeholder="Confirm password..." autocapitalize="none" autocorrect="off" spellcheck="false" required />
          <i class="ri-eye-off-fill toggle-password" data-target="regConfirmPassword" title="Toggle password visibility"></i>
        </div>
      </div>

      <button type="submit" class="btn-submit">Create Account & Launch ➔</button>

      <div class="form-footer">
        Already have an account? <a href="#" id="linkToLogin">Sign In</a>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
