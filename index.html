<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MICHI (道) — Login</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="Images/Michi_Appicon.png">
  <style>
    :root {
      --bg: #F9FEFF;
      --card: #D9DDDE;
      --border: #B2B7B9;
      --text: #1C2D37;
      --accent: #009967;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .login-title {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--accent);
      margin: 0 0 0.4rem 0;
      letter-spacing: 2px;
    }
    .login-sub {
      font-size: 0.88rem;
      color: #526570;
      margin-bottom: 1.8rem;
    }
    .login-input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #F9FEFF;
      color: #1C2D37;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      text-align: center;
      box-sizing: border-box;
      margin-bottom: 1rem;
      outline: none;
    }
    .login-btn {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      font-weight: 800;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 153, 103, 0.3);
      transition: transform 0.15s ease;
    }
    .login-btn:active {
      transform: scale(0.98);
    }
  </style>
  <script>
    // Auto-proceed if already logged in
    if (localStorage.getItem('michi_logged_in') === 'true') {
      window.location.replace("dashboard.html");
    }
  </script>
</head>
<body>
  <div class="login-card">
    <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🪼</div>
    <h1 class="login-title">MICHI (道)</h1>
    <p class="login-sub">For Work and Life Engine — Workspace Access</p>
    
    <form id="loginForm" onsubmit="event.preventDefault(); localStorage.setItem('michi_logged_in', 'true'); window.location.href='dashboard.html';">
      <input type="password" id="passInput" class="login-input" placeholder="Enter Workspace Passcode..." value="1234" required />
      <button type="submit" class="login-btn">🔓 Unlock Workspace</button>
    </form>
  </div>
</body>
</html>
